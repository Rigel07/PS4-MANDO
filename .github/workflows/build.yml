name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir los zip del repositorio
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Descomprimiendo $z"
            mkdir -p "_unzipped/${z%.zip}"
            unzip -o -q "$z" -d "_unzipped/${z%.zip}"
          done
          find _unzipped -name build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar
        run: |
          set -e
          mkdir -p out
          find _unzipped -name build.gradle | while read -r f; do
            dir=$(dirname "$f")
            echo "=== Compilando $dir"
            (cd "$dir" && gradle build --no-daemon)
            cp "$dir"/build/libs/*.jar out/
          done
          rm -f out/*-sources.jar out/*-slim.jar
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: mods
          path: out/*.jar
